<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
      .scan { animation: scan 4s linear infinite; }
      @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
    </style>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="1198" height="62" rx="12"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="62" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
  <g clip-path="url(#c)">
    <rect class="scan" x="0" y="1" width="200" height="2" fill="url(#beam)"/>
    <rect x="1" y="1" width="150" height="62" fill="#1E3A8A"/>
  </g>

  <g class="mono" font-size="14">
    <circle class="pulse" cx="28" cy="32" r="5" fill="#4ADE80"/>
    <text x="42" y="37" fill="#DBEAFE" font-weight="700">online</text>

    <text x="176" y="37" fill="#94A3B8">git:(main)</text>
    <text x="290" y="37" fill="#4ADE80">✓ todos os checks passaram</text>

    <text x="1176" y="37" fill="#60A5FA" text-anchor="end">aprender → construir → publicar → repetir</text>
    <text x="800" y="37" fill="#64748B" text-anchor="end">Python 3 · UTF-8 ·</text>
  </g>
</svg>
